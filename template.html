<!DOCTYPE html>
<!-- Note that all $variable$ things will get replaced by Pandoc at render-time -->
<html lang="$if(lang)$$lang$$else$en$endif$">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<title>$if(title)$$title$$else$Homily$endif$</title>
	<style>
		:root {
			--side-margin: $side_margin$;
			--top-margin: $top_margin$;
			--bottom-margin: $bottom_margin$;
			--text-color: $text_color$;
			--background-color: $background_color$;
			--font-size: $font_size$;
			--font-family: $font$;
			--line-height: $line_height$;
			--paragraph-spacing: $paragraph_spacing$;
			--text-align: $if(justify)$justify$else$left$endif$;
		}

		html, body {
			margin: 0;
			height: 100%;
			overflow: hidden;
			background: var(--background-color);
			color: var(--text-color);
		}

		body {
			font-family: var(--font-family);
			font-size: var(--font-size);
			line-height: var(--line-height);
			text-align: var(--text-align);
			-webkit-text-size-adjust: 100%;
			-webkit-user-select: none;
			user-select: none;
			-webkit-touch-callout: none;
			touch-action: manipulation;
		}

		#viewport {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			touch-action: manipulation;
		}

		/* each "page" is a column */
		#speaking-script {
			position: relative;
			margin-left: var(--side-margin);
			margin-top: var(--top-margin);
			width: calc(100vw - 2 * var(--side-margin));
			height: calc(100dvh - var(--top-margin) - var(--bottom-margin));
			column-width: calc(100vw - 2 * var(--side-margin));
			column-gap: calc(2 * var(--side-margin));
			column-fill: auto;
		}

		#speaking-script p, #speaking-script li, #speaking-script blockquote {
			break-inside: avoid;
			-webkit-column-break-inside: avoid;
			page-break-inside: avoid;
		}

		#speaking-script p {
			margin: 0 0 var(--paragraph-spacing);
		}

		#reading-info {
			font-size: 0.55em;
			line-height: 1.3;
			opacity: 0.6;
			margin-bottom: 1.5em;
			break-inside: avoid;
			break-after: avoid;
			text-align: right;
		}

		#page-counter {
			position: fixed;
			left: var(--side-margin);
			top: calc(env(safe-area-inset-bottom, 0px));
			font-size: 16px;
			opacity: 0.45;
			pointer-events: none;
		}

		#fin-marker {
			display: flex;
			align-items: center;
			gap: 0.6em;
			margin-top: 1.5em;
			break-inside: avoid;
			opacity: 0.2;
		}

		#fin-marker::before,
		#fin-marker::after {
			content: "";
			flex: 1;
			border-top: 2px solid currentColor;
		}
	</style>
</head>
<body>
	<div id="viewport">
		<div id="speaking-script">
			<header id="reading-info">
				$if(lectionary_number)$<div>Lectionary $lectionary_number$: $lectionary_string$</div>$endif$
				$if(readings)$<div>$readings$</div>$endif$
				$if(location)$<div>$location$$if(date)$; $date$$endif$</div>$elseif(date)$<div>$date$</div>$endif$
			</header>
			$body$
			<div id="fin-marker" aria-hidden="true">◆</div>
		</div>
	</div>
	<div id="page-counter"></div>

	<script type="module">
		const viewportEl = document.getElementById("viewport");
		const speakingScriptEl = document.getElementById("speaking-script");
		const pageCounterEl = document.getElementById("page-counter");

		const deadZone = 10; // how much drift (in pixels) we can have in touches and still read as taps

		// if we ever set up a Bluetooth clicker or something
		const forwardKeys = new Set(["ArrowRight", "ArrowDown", "PageDown", "Enter"]);
		const backKeys = new Set(["ArrowLeft", "ArrowUp", "PageUp"]);

		let currentPageIdx = 0;
		let totalPages = 1;
		let firstBlockCurrPage = null;
		let touchStartX = 0;
		let touchStartY = 0;
		let recalculateLayoutTimer = null;

		function getPageWidth() {
			const columnGap = parseFloat(getComputedStyle(speakingScriptEl).columnGap) || 0;
			return speakingScriptEl.getBoundingClientRect().width + columnGap;
		};
		const clampPageIdx = (pageIdx) => Math.max(0, Math.min(totalPages - 1, pageIdx));

		function measureTotalPages() {
			const columnGap = parseFloat(getComputedStyle(speakingScriptEl).columnGap) || 0;
			const totalWidth = speakingScriptEl.scrollWidth + columnGap;
			totalPages = Math.max(1, Math.round(totalWidth / getPageWidth()));
		}

		function renderCurrentPage() {
			const pageWidth = getPageWidth();
			speakingScriptEl.style.translate = (-currentPageIdx * pageWidth) + "px";
			pageCounterEl.textContent = (currentPageIdx + 1) + " / " + totalPages;

			// for dealing with reflow
			firstBlockCurrPage = Array.from(speakingScriptEl.children).find((block) => block.offsetLeft >= currentPageIdx * pageWidth - 1) ?? null;
		}

		function turnPage(direction) {
			currentPageIdx = clampPageIdx(currentPageIdx + direction);
			renderCurrentPage();
		}

		function recalculateLayout() {
			measureTotalPages();
			if (firstBlockCurrPage) {
				currentPageIdx = Math.floor((firstBlockCurrPage.offsetLeft + 1) / getPageWidth());
			}
			currentPageIdx = clampPageIdx(currentPageIdx);
			renderCurrentPage();
		}

		function scheduleRecalculateLayout() {
			clearTimeout(recalculateLayoutTimer);
			recalculateLayoutTimer = setTimeout(recalculateLayout, 100);
		}

		// tap controls
		viewportEl.addEventListener("pointerdown", (evt) => {
			touchStartX = evt.clientX;
			touchStartY = evt.clientY;
		});

		viewportEl.addEventListener("pointerup", (evt) => {
			if (evt.pointerType === "mouse" && evt.button !== 0) {
				return;
			}
			const dist = Math.hypot(evt.clientX - touchStartX, evt.clientY - touchStartY);
			if (dist > deadZone) {
				return;
			}

			const goingBack = evt.clientX < window.innerWidth / 3;
			turnPage(goingBack ? -1 : 1);
		});

		document.addEventListener("keydown", (evt) => {
			const fwd  = forwardKeys.has(evt.key);
			const back = backKeys.has(evt.key);
			if (!fwd && !back) return;

			evt.preventDefault();
			turnPage(fwd ? 1 : -1);
		});

		window.addEventListener("resize", scheduleRecalculateLayout);
		window.addEventListener("orientationchange", scheduleRecalculateLayout);
		window.addEventListener("load", recalculateLayout);
		document.fonts?.ready.then(recalculateLayout);

		// avoid pinch zooms
		document.addEventListener("gesturestart", (evt) => evt.preventDefault());

		recalculateLayout();
	</script>
</body>
</html>
